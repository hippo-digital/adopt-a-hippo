<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopt a Hippo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .hippo-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #333;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .checkbox-label {
      font-size: 14px;
      color: #555;
      cursor: pointer;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .message {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .admin-link {
      text-align: center;
      margin-top: 20px;
    }

    .admin-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
    }

    .admin-link a:hover {
      text-decoration: underline;
    }

    .loading {
      display: none;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="hippo-icon">🦛</div>
      <h1>Adopt a Hippo</h1>
      <p class="subtitle">Complete the form below to request adoption</p>
    </div>

    <div id="message"></div>

    <form id="adoptionForm">
      <div class="form-group">
        <label for="name">Your Name *</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="confirm" name="confirm" required>
          <label for="confirm" class="checkbox-label">I confirm that I want to adopt a hippo and understand the responsibility involved</label>
        </div>
      </div>

      <div class="form-group">
        <div class="checkbox-group">
          <input type="checkbox" id="consent" name="consent" required>
          <label for="consent" class="checkbox-label">I agree to the hippo adoption terms and conditions</label>
        </div>
      </div>

      <button type="submit">
        <span class="normal">Submit Adoption Request</span>
        <span class="loading">Submitting...</span>
      </button>
    </form>

    <div class="admin-link">
      <a href="/admin">Admin Dashboard</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('adoptionForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const button = form.querySelector('button');
      const normalText = button.querySelector('.normal');
      const loadingText = button.querySelector('.loading');

      // Get form data
      const name = document.getElementById('name').value;
      const confirm = document.getElementById('confirm').checked;
      const consent = document.getElementById('consent').checked;

      button.disabled = true;
      normalText.style.display = 'none';
      loadingText.style.display = 'inline';

      try {
        const response = await fetch('/api/adopt', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, confirm, consent })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.innerHTML = `<div class="message success">✓ ${data.message}</div>`;
          form.reset();
          setTimeout(() => {
            messageDiv.innerHTML = '';
          }, 5000);
        } else {
          messageDiv.innerHTML = `<div class="message error">✗ ${data.error}</div>`;
        }
      } catch (error) {
        messageDiv.innerHTML = `<div class="message error">✗ An error occurred. Please try again.</div>`;
        console.error('Error:', error);
      } finally {
        button.disabled = false;
        normalText.style.display = 'inline';
        loadingText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
