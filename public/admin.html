<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Adopt a Hippo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
      font-size: 28px;
    }

    .back-link {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .stat-number {
      font-size: 36px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .submissions-section {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .section-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      background: #f9f9f9;
    }

    .section-title {
      color: #333;
      font-size: 18px;
      font-weight: 600;
    }

    .submission-item {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .submission-item:last-child {
      border-bottom: none;
    }

    .submission-info {
      flex: 1;
    }

    .submission-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .submission-details {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #fff3cd;
      color: #856404;
    }

    .status-approved {
      background: #d4edda;
      color: #155724;
    }

    .status-rejected {
      background: #f8d7da;
      color: #721c24;
    }

    .submission-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-approve {
      background: #28a745;
      color: white;
    }

    .btn-approve:hover {
      background: #218838;
    }

    .btn-reject {
      background: #dc3545;
      color: white;
    }

    .btn-reject:hover {
      background: #c82333;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: #999;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      border-bottom: 1px solid #e0e0e0;
      background: #f9f9f9;
    }

    .filter-tab {
      padding: 6px 12px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #666;
      transition: all 0.2s;
    }

    .filter-tab.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .submission-item {
        flex-direction: column;
      }

      .submission-actions {
        width: 100%;
      }

      .submission-actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🦛 Admin Dashboard</h1>
      <a href="/" class="back-link">← Back to Form</a>
    </div>

    <div class="stats" id="statsContainer"></div>

    <div class="submissions-section">
      <div class="section-header">
        <div class="section-title">Adoption Requests</div>
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="pending">Pending</button>
        <button class="filter-tab" data-filter="approved">Approved</button>
        <button class="filter-tab" data-filter="rejected">Rejected</button>
      </div>

      <div id="submissionsContainer" class="loading">Loading submissions...</div>
    </div>
  </div>

  <script>
    let allSubmissions = [];
    let currentFilter = 'all';

    // Load stats
    async function loadStats() {
      try {
        const response = await fetch('/api/stats');
        const stats = await response.json();

        const statsHtml = `
          <div class="stat-card">
            <div class="stat-number">${stats.total}</div>
            <div class="stat-label">Total Requests</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${stats.pending}</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${stats.approved}</div>
            <div class="stat-label">Approved</div>
          </div>
          <div class="stat-card">
            <div class="stat-number">${stats.rejected}</div>
            <div class="stat-label">Rejected</div>
          </div>
        `;

        document.getElementById('statsContainer').innerHTML = statsHtml;
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    // Load submissions
    async function loadSubmissions() {
      try {
        const response = await fetch('/api/submissions');
        allSubmissions = await response.json();
        renderSubmissions();
      } catch (error) {
        console.error('Error loading submissions:', error);
        document.getElementById('submissionsContainer').innerHTML = '<div class="error">Error loading submissions</div>';
      }
    }

    // Render submissions with filter
    function renderSubmissions() {
      const container = document.getElementById('submissionsContainer');

      let filtered = allSubmissions;
      if (currentFilter !== 'all') {
        filtered = allSubmissions.filter(s => s.status === currentFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No submissions found</div>';
        return;
      }

      const html = filtered.map(submission => {
        const submittedDate = new Date(submission.submittedAt).toLocaleDateString();
        const statusClass = `status-${submission.status}`;

        return `
          <div class="submission-item">
            <div class="submission-info">
              <div class="submission-name">${escapeHtml(submission.name)}</div>
              <div class="submission-details">Submitted: ${submittedDate}</div>
              <div class="submission-details">Confirmed: ${submission.confirm ? '✓ Yes' : '✗ No'} | Consented: ${submission.consent ? '✓ Yes' : '✗ No'}</div>
              <span class="status-badge ${statusClass}">${submission.status.toUpperCase()}</span>
            </div>
            <div class="submission-actions">
              ${submission.status === 'pending' ? `
                <button class="btn-approve" onclick="reviewSubmission(${submission.id}, 'approved')">Approve</button>
                <button class="btn-reject" onclick="reviewSubmission(${submission.id}, 'rejected')">Reject</button>
              ` : `
                <div style="color: #999; font-size: 13px;">Reviewed by: ${submission.reviewedBy || 'N/A'}</div>
              `}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    // Review submission
    async function reviewSubmission(id, status) {
      try {
        const response = await fetch(`/api/submissions/${id}/review`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status, reviewer: 'admin' })
        });

        if (response.ok) {
          await loadSubmissions();
          await loadStats();
        }
      } catch (error) {
        console.error('Error reviewing submission:', error);
      }
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderSubmissions();
      });
    });

    // Load data on page load
    window.addEventListener('load', () => {
      loadStats();
      loadSubmissions();

      // Reload every 5 seconds
      setInterval(() => {
        loadSubmissions();
        loadStats();
      }, 5000);
    });
  </script>
</body>
</html>
